# Codemagic builds the iPhone/iPad app on a Mac in the cloud and sends it to TestFlight.
# This file must sit at the TOP of the GitHub repo (not inside a folder).
# Before the first build: follow LAUNCH-STEPS.md (connect your Apple account and GitHub to Codemagic).
workflows:
  ios-release:
    name: Doodle Clubhouse (iOS)
    max_build_duration: 60
    working_directory: doodle-clubhouse-app   # the app lives in this folder
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Doodle Clubhouse        # the name you give your App Store Connect API key in Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.doodleclubhouse.app
      vars:
        APP_STORE_APPLE_ID: 6820435072           # replace with your app's "Apple ID" number from App Store Connect > App Information
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install packages
        script: npm install
      - name: App Store rating plugin (the little "rate this app" stars box)
        script: |
          npm install @capacitor-community/in-app-review@^7 --fetch-timeout=60000 --fetch-retries=1 || npm install @capacitor-community/in-app-review --legacy-peer-deps --fetch-timeout=60000 --fetch-retries=1 || echo "rating plugin skipped: the app simply won't ask for ratings"
      - name: Download the app fonts
        script: |
          mkdir -p www/fonts
          curl -fL --connect-timeout 20 --max-time 90 --retry 2 -o www/fonts/BagelFatOne-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/bagelfatone/BagelFatOne-Regular.ttf"
          curl -fL --connect-timeout 20 --max-time 90 --retry 2 -o www/fonts/Nunito.ttf "https://github.com/google/fonts/raw/main/ofl/nunito/Nunito%5Bwght%5D.ttf"
          curl -fL --connect-timeout 20 --max-time 90 --retry 2 -o www/fonts/PermanentMarker-Regular.ttf "https://github.com/google/fonts/raw/main/apache/permanentmarker/PermanentMarker-Regular.ttf" || echo "font PermanentMarker-Regular.ttf skipped (the app uses a built-in lookalike)"
          curl -fL --connect-timeout 20 --max-time 90 --retry 2 -o www/fonts/PatrickHand-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/patrickhand/PatrickHand-Regular.ttf" || echo "font PatrickHand-Regular.ttf skipped (the app uses a built-in lookalike)"
          curl -fL --connect-timeout 20 --max-time 90 --retry 2 -o www/fonts/Bangers-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/bangers/Bangers-Regular.ttf" || echo "font Bangers-Regular.ttf skipped (the app uses a built-in lookalike)"
          curl -fL --connect-timeout 20 --max-time 90 --retry 2 -o www/fonts/Pacifico-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/pacifico/Pacifico-Regular.ttf" || echo "font Pacifico-Regular.ttf skipped (the app uses a built-in lookalike)"
          curl -fL --connect-timeout 20 --max-time 90 --retry 2 -o www/fonts/Creepster-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/creepster/Creepster-Regular.ttf" || echo "font Creepster-Regular.ttf skipped (the app uses a built-in lookalike)"
      - name: Create the iOS project, icons and splash screen
        script: |
          [ -d ios ] || npx cap add ios
          # Apple needs iOS 15 or newer as the minimum (from April 2027)
          sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9]+\.[0-9]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' -E "s/platform :ios, '[0-9]+\.[0-9]+'/platform :ios, '15.0'/" ios/App/Podfile
          grep -m1 "IPHONEOS_DEPLOYMENT_TARGET" ios/App/App.xcodeproj/project.pbxproj; grep -m1 "platform :ios" ios/App/Podfile
          npx capacitor-assets generate --ios --iconBackgroundColor '#1C2B6B' --splashBackgroundColor '#1C2B6B'
          npx cap sync ios
      - name: Apple Pencil fix (fast taps and quick writing never get dropped)
        script: |
          AD=ios/App/App/AppDelegate.swift
          if grep -q "DoodleTouchFix" "$AD"; then echo "already added"; else
            cat native/DoodleTouchFix.swift >> "$AD"
            perl -0pi -e 's/(didFinishLaunchingWithOptions[^{]*\{)/$1\n        DoodleTouchFix.install()/' "$AD"
          fi
          grep -n "DoodleTouchFix.install()" "$AD" || echo "WARNING: could not hook the Pencil fix into AppDelegate"
      - name: App name and permissions
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Doodle Clubhouse" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Doodle Clubhouse saves your drawings and animations to Photos when you tap Save.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Doodle Clubhouse uses the microphone only when you tap the mic to record a sound for your cartoon.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Doodle Clubhouse uses the camera only when you choose Take Photo to add a picture to your drawing.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Doodle Clubhouse opens your photos only when you choose Import photo to add a picture to your drawing.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
      - name: Code signing
        script: xcode-project use-profiles
      - name: Build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: Build the app
        script: xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
      - name: Upload to App Store Connect (gives up instead of hanging)
        script: |
          # Apple's upload tool sometimes waits forever. Each try stops after 12 minutes, and it tries twice,
          # so a slow night at Apple can't use up a whole hour of build minutes.
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          for try in 1 2; do
            if perl -e 'alarm shift; exec @ARGV' 720 app-store-connect publish --path "$IPA"; then exit 0; fi
            echo "Upload try $try didn't finish; trying again in 30 seconds"; sleep 30
          done
          echo "Apple's upload didn't answer. The finished app (App.ipa) is saved under Artifacts; try again later or use Transporter."
          exit 1
    artifacts:
      - build/ios/ipa/*.ipa
      - doodle-clubhouse-app/build/ios/ipa/*.ipa
